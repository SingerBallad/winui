<!doctype html>
<html lang="zh-CN" data-win-app>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WinUI 3 Gallery · Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6.5' height='6.5' rx='1.5' fill='%230078D4'/%3E%3Crect x='8.5' y='1' width='6.5' height='6.5' rx='1.5' fill='%2360CDFF'/%3E%3Crect x='1' y='8.5' width='6.5' height='6.5' rx='1.5' fill='%2360CDFF'/%3E%3Crect x='8.5' y='8.5' width='6.5' height='6.5' rx='1.5' fill='%23005FB8'/%3E%3C/svg%3E" />
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  #titlebar { flex: none; }
  #nav { flex: 1 1 auto; min-height: 0; }
  .app-icon { width: 16px; height: 16px; flex: none; }
  win-auto-suggest-box.search { width: min(360px, 100%); }
  .tb-btn { width: 40px; height: 36px; display: inline-grid; place-items: center; border-radius: 4px; color: var(--w-text-fill-color-primary); background: transparent; border: 0; padding: 0; cursor: default; }
  .tb-btn:hover { background: var(--w-subtle-fill-color-secondary); }
  .tb-btn:active { background: var(--w-subtle-fill-color-tertiary); color: var(--w-text-fill-color-secondary); }
  .tb-btn:focus-visible { outline: 2px solid var(--w-focus-stroke-color-outer); outline-offset: -2px; }
  .tb-btn[disabled] { color: var(--w-text-fill-color-disabled); pointer-events: none; }
  #content { min-height: 100%; }
  .page { padding: 32px 56px 56px; max-width: 1180px; box-sizing: border-box; }
  .page-cat { font: var(--w-type-caption); color: var(--w-text-fill-color-secondary); margin-bottom: 4px; }
  .page h1 { font: var(--w-type-title); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  .page .lede { max-width: 820px; margin: 0 0 12px; }
  .doc-links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 -11px 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag { font: var(--w-type-caption); font-family: var(--w-font-family-mono); padding: 2px 8px; border-radius: 4px; background: var(--w-subtle-fill-color-secondary); color: var(--w-text-fill-color-secondary); }
  .badge { font: var(--w-type-caption); font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--w-accent-fill-color-default); color: var(--w-text-on-accent-fill-color-primary); }

  .sample { margin-top: 28px; }
  .sample-head { display: flex; align-items: flex-end; gap: 8px; margin: 0 0 8px; }
  .sample-title { font: var(--w-type-body-strong); margin: 0 0 4px; flex: 1; }
  .sample-tools { display: flex; gap: 4px; }
  .sample-desc { margin: -4px 0 12px; color: var(--w-text-fill-color-secondary); max-width: 820px; }
  .card { border: 1px solid var(--w-card-stroke-color-default); border-radius: 8px; overflow: hidden; background: var(--w-card-background-fill-color-default); }
  .example-row { display: flex; min-height: 64px; position: relative; }
  .example-row[data-win-theme] { background: linear-gradient(var(--w-card-background-fill-color-default), var(--w-card-background-fill-color-default)), var(--w-solid-background-fill-color-base); color: var(--w-text-fill-color-primary); }
  .example-theme { width: 32px; height: 28px; color: var(--w-text-fill-color-secondary); }
  .example-theme[aria-pressed="true"] { background: var(--w-subtle-fill-color-secondary); color: var(--w-text-fill-color-primary); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .example { flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px; }
  .example > .row, .example > .col, .example > [data-stretch] { align-self: stretch; }
  .options { box-sizing: border-box; width: 240px; flex: none; padding: 16px; border-left: 1px solid var(--w-card-stroke-color-default); display: flex; flex-direction: column; gap: 10px; background: var(--w-card-background-fill-color-secondary); }
  .options .opt-title { font: var(--w-type-caption); color: var(--w-text-fill-color-secondary); }
  .output { font: var(--w-type-body); color: var(--w-text-fill-color-secondary); }
  .output:empty { display: none; }
  details.source { border-top: 1px solid var(--w-card-stroke-color-default); background: var(--w-card-background-fill-color-secondary); }
  details.source > summary { list-style: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; cursor: default; user-select: none; color: var(--w-text-fill-color-primary); }
  details.source > summary::-webkit-details-marker { display: none; }
  details.source > summary:hover { background: var(--w-subtle-fill-color-secondary); }
  details.source > summary .chev { margin-left: auto; display: inline-flex; transition: transform var(--w-duration-normal) var(--w-ease-decelerate); color: var(--w-text-fill-color-secondary); }
  details.source[open] > summary .chev { transform: rotate(180deg); }
  .code-wrap { position: relative; border-top: 1px solid var(--w-card-stroke-color-default); }
  .code-wrap pre { margin: 0; padding: 14px 16px; overflow: auto; font: 13px/19px var(--w-font-family-mono); color: var(--w-text-fill-color-primary); tab-size: 2; max-height: 420px; }
  .code-wrap .copy { position: absolute; top: 8px; right: 8px; }
  .hl-tag { color: #800000; } .hl-attr { color: #e50000; } .hl-str { color: #0000ff; } .hl-com { color: #008000; } .hl-kw { color: #0000ff; }
  [data-win-theme="dark"] .hl-tag, :root:not([data-win-theme="light"]) .hl-tag { color: var(--hl-tag, #800000); }
  .code-lang { font: var(--w-type-caption); color: var(--w-text-fill-color-secondary); padding: 8px 16px 0; }

  .hero { position: relative; margin: -32px -56px 0; padding: 48px 56px 40px; overflow: hidden; border-top-left-radius: 8px; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(80% 140% at 85% 0%, color-mix(in srgb, var(--w-system-accent-color-light2) 45%, transparent), transparent 60%), radial-gradient(60% 120% at 10% 100%, color-mix(in srgb, var(--w-system-accent-color) 30%, transparent), transparent 60%); opacity: .9; }
  .hero > * { position: relative; }
  .hero h1 { font: var(--w-type-title-large); margin: 0 0 8px; }
  .hero p { margin: 0; max-width: 640px; color: var(--w-text-fill-color-secondary); }
  .stats { display: flex; gap: 32px; margin-top: 20px; }
  .stat b { display: block; font: var(--w-type-subtitle); }
  .stat span { font: var(--w-type-caption); color: var(--w-text-fill-color-secondary); }
  .section-title { font: var(--w-type-subtitle); margin: 32px 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .tile { display: flex; gap: 16px; align-items: center; min-height: 86px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--w-card-stroke-color-default); background: var(--w-card-background-fill-color-default); color: inherit; text-decoration: none; cursor: default; transition: background-color var(--w-duration-faster) linear, transform var(--w-duration-fast) var(--w-ease-decelerate), box-shadow var(--w-duration-fast) var(--w-ease-decelerate); outline: none; }
  .tile:hover { background: var(--w-card-background-fill-color-secondary); box-shadow: var(--w-elevation-card); transform: translateY(-1px); }
  .tile:active { transform: none; box-shadow: none; }
  .tile:focus-visible { outline: 2px solid var(--w-focus-stroke-color-outer); outline-offset: 1px; }
  .tile .t-icon { width: 48px; height: 48px; flex: none; display: grid; place-items: center; font-family: var(--w-font-family-icon); font-size: 24px; border-radius: 8px; background: var(--w-subtle-fill-color-secondary); color: var(--w-accent-text-fill-color-primary); }
  .tile .t-title { font: var(--w-type-body-strong); display: flex; align-items: center; gap: 8px; }
  .tile .t-desc { font: var(--w-type-caption); color: var(--w-text-fill-color-secondary); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--w-text-fill-color-secondary); margin-top: 24px; }

  .settings-group { display: flex; flex-direction: column; gap: 4px; max-width: 1000px; }
  .settings-section { font: var(--w-type-body-strong); margin: 24px 0 6px; }
  .settings-section:first-child { margin-top: 4px; }
  .accent-now { display: inline-block; width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--w-control-stroke-color-default); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0; }
  .swatch { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--w-control-stroke-color-default); cursor: default; outline: none; transition: transform var(--w-duration-fast) var(--w-ease-decelerate); }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--w-solid-background-fill-color-base), 0 0 0 4px var(--w-text-fill-color-primary); }
  .swatch:focus-visible { outline: 2px solid var(--w-focus-stroke-color-outer); outline-offset: 3px; }

  @media (max-width: 860px) {
    .page { padding: 24px 20px 40px; }
    .hero { margin: -24px -20px 0; padding: 32px 20px; }
    .example-row { flex-direction: column; }
    .options { width: auto; border-left: 0; border-top: 1px solid var(--w-card-stroke-color-default); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <win-title-bar id="titlebar" bar-title="WinUI 3 Gallery" subtitle="Web" is-back-button-visible is-pane-toggle-button-visible>
    <svg slot="icon" class="app-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="var(--w-system-accent-color)"/><rect x="8.5" y="1" width="6.5" height="6.5" rx="1.5" fill="var(--w-system-accent-color-light2)"/><rect x="1" y="8.5" width="6.5" height="6.5" rx="1.5" fill="var(--w-system-accent-color-light2)"/><rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1.5" fill="var(--w-system-accent-color-dark1)"/></svg>
    <win-auto-suggest-box id="search" class="search" placeholder="搜索控件和示例" display-member-path="title" text-member-path="title" aria-label="搜索控件和示例" access-key="E"></win-auto-suggest-box>
    <win-button slot="right-header" id="theme-toggle" appearance="subtle" aria-label="切换浅色/深色主题" tooltip="切换浅色/深色主题"></win-button>
  </win-title-bar>
  <win-navigation-view id="nav" pane-display-mode="auto" is-back-button-visible="collapsed" is-pane-toggle-button-visible="false" aria-label="控件导航">
    <div id="content" tabindex="-1"></div>
  </win-navigation-view>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
